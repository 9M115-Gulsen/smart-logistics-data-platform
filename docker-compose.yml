services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deals_bigdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deals_bigdata"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=deals_bigdata
      - AS_OF=2026-10-26
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "run_pipeline.sh"]

volumes:
  pgdata:
